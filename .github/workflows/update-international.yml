name: Update international news

on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 minutes
  workflow_dispatch:          # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: update-international
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect news and results (all series)
        run: node scripts/update-international.mjs

      - name: Save changes
        run: |
          git config user.name "apex-media-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new stories."
          else
            git commit -m "Update international news and results"
            git push
          fi
