<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex Media · Pit Wall preview</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/apex-logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Pit Wall: a race-engineer's timing wall. Left rail picks edition + series; three live panels (feed, results, standings) over a calendar timeline. Dark only, by design. */
:root{
  --bg:#0b0d0c; --panel:#121513; --panel-2:#181c19; --line:#252b26; --fg:#e9ece8; --muted:#8d958c;
  --green:#3cff1a; --amber:#ffc21a; --purple:#b36bff;
  --f-display:"Rajdhani","Arial Narrow",sans-serif; --f-body:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);min-height:100vh}
a{color:inherit;text-decoration:none}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.cap{font-family:var(--f-display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--muted)}

/* preview banner */
.pv{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;padding:7px max(16px,env(safe-area-inset-left,0px));background:var(--green);color:#0b0d0c;font:600 13px var(--f-body)}
.pv a{text-decoration:underline;text-underline-offset:2px}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 34px)}
.rail{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:block;align-self:flex-start;flex:none;height:58px;width:121px;background:url(../assets/apex-logo.webp) no-repeat;background-size:128.2% auto;background-position:65.9% 38.4%;mix-blend-mode:lighten;aspect-ratio:2.08}
.ed{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);padding:3px;gap:3px;border:1px solid var(--line)}
.ed button{border:0;background:transparent;padding:8px 4px;cursor:pointer;font:700 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ed button[aria-pressed="true"]{background:var(--green);color:#0b0d0c}
.series{display:grid;gap:2px}
.series button{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;cursor:pointer;font-size:14px;color:var(--fg)}
.series button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.series button span:last-child{font:500 12px var(--f-mono);color:var(--muted)}
.series button:hover{background:var(--panel-2)}
.series button[aria-pressed="true"]{background:var(--panel-2);box-shadow:inset 3px 0 var(--green)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);display:grid;gap:4px}

/* top bar */
.top{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--panel);min-height:48px}
.ticker{flex:1;overflow:hidden;display:flex;align-items:center;min-width:0;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ticker-track{display:inline-flex;gap:40px;white-space:nowrap;animation:tick 70s linear infinite;padding-left:20px}
.ticker-track a{font-size:14px}
.ticker-track b{font:700 12px var(--f-display);letter-spacing:.1em;color:var(--green);margin-right:8px}
@keyframes tick{to{transform:translateX(-50%)}}
.next{display:flex;align-items:center;gap:12px;padding:0 18px;border-left:1px solid var(--line);white-space:nowrap}
.next b{font:700 18px var(--f-display);text-transform:uppercase}
.next .mono{color:var(--amber);font-size:17px}

/* mobile view switch */
.views{display:none}

/* board */
main{padding:18px;display:grid;gap:18px;align-content:start;min-width:0}
.board{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h2{margin:0;font:700 22px var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.ph h2 i{display:inline-block;width:9px;height:9px;background:var(--green);margin-right:8px;vertical-align:2px}

/* feed */
.feat{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;padding:14px;border-bottom:1px solid var(--line)}
.feat .img{aspect-ratio:4/3;background:var(--panel-2) center/cover no-repeat;max-width:100%}
.feat h3{margin:4px 0 6px;font:700 22px/1.1 var(--f-display)}
.feat p{margin:0;color:var(--muted);font-size:14px}
.feed{list-style:none;margin:0;padding:0;max-height:880px;overflow:auto}
.feed a{display:grid;grid-template-columns:52px 96px minmax(0,1fr);gap:10px;align-items:baseline;padding:9px 14px;border-bottom:1px solid var(--line)}
.feed a:hover{background:var(--panel-2)}
.feed .t{font:500 12px var(--f-mono);color:var(--muted)}
.tag{display:inline-block;font:700 11px var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-left:3px solid var(--c);background:var(--panel-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.feed .h{font-size:15px;line-height:1.3}
.feed .h small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.res-flag{font:700 10px var(--f-display);letter-spacing:.1em;color:#0b0d0c;background:var(--green);padding:1px 5px;margin-right:6px;vertical-align:1px}
.empty{padding:20px 14px;color:var(--muted)}

/* tabs + tower */
.tabs{display:flex;gap:2px;background:var(--bg);padding:2px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:5px 10px;cursor:pointer;font:700 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--fg);color:#0b0d0c}
.race-h{padding:12px 14px 8px}
.race-h b{display:block;font:700 20px var(--f-display);text-transform:uppercase}
.tower{list-style:none;margin:0;padding:0 8px 10px}
.tower li{display:grid;grid-template-columns:30px 4px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--line)}
.tower li:nth-child(-n+3) .p{color:var(--green)}
.tower .p{font:700 15px var(--f-mono);text-align:right}
.tower .c{height:22px;background:var(--c)}
.tower .n{min-width:0}
.tower .n b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tower .n small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tower .v{font:500 13px var(--f-mono);text-align:right;color:var(--muted)}
.tower .v.pts{color:var(--fg);font-weight:700}
.fl{color:var(--purple);font:700 10px var(--f-display);letter-spacing:.1em;margin-left:6px}
.note{padding:0 14px 12px;font-size:12px;color:var(--muted)}
.note a{color:var(--green)}
.sel{display:block;width:100%;background:var(--bg);border:1px solid var(--line);padding:8px 10px;font:600 15px var(--f-body)}
.lead-bar{display:flex;justify-content:space-between;align-items:center;margin:12px 14px 6px;padding:10px 12px;background:var(--panel-2);border-left:4px solid var(--c)}
.lead-bar b{font:700 20px var(--f-display);text-transform:uppercase}
.lead-bar .mono{font-size:22px;font-weight:700}
.lead-bar small{display:block;color:var(--amber);font:500 12px var(--f-mono);text-align:right}
.sample{font:700 10px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber);padding:1px 5px}

/* calendar timeline */
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);overflow-x:auto;scroll-snap-type:x mandatory}
.ev{scroll-snap-align:start;padding:12px 14px;border-right:1px solid var(--line);display:grid;gap:4px;position:relative}
.ev::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c);opacity:.8}
.ev .d{font:700 13px var(--f-mono);color:var(--amber)}
.ev b{font:700 18px/1.1 var(--f-display);text-transform:uppercase}
.ev small{color:var(--muted);font-size:12px}
.ev.done{opacity:.45}
.ev.live{background:rgba(60,255,26,.07)}
.ev.live .d::after{content:" · LIVE";color:var(--green)}

/* responsive */
@media (max-width:1250px){.board{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.board .feed-p{grid-column:1/-1}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line)}
  .logo{height:40px;width:83px;align-self:center}
  .ed{margin-left:auto;min-width:200px}
  .series{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;width:100%;scrollbar-width:none}
  .series button{padding:6px 10px;background:var(--panel-2)}
  .rail-foot,.rail .cap{display:none}
  .next{display:none}
  main{padding:12px max(12px,env(safe-area-inset-left,0px)) 80px}
  .board{grid-template-columns:1fr}
  .views{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .views button{border:0;background:transparent;padding:12px 4px;cursor:pointer;font:700 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .views button[aria-pressed="true"]{color:var(--green);box-shadow:inset 0 3px var(--green)}
  body[data-view] .vw{display:none}
  body[data-view="feed"] .vw-feed,body[data-view="results"] .vw-results,body[data-view="standings"] .vw-standings,body[data-view="calendar"] .vw-calendar{display:block}
  .feat{grid-template-columns:110px minmax(0,1fr)}
  .feed{max-height:none}
  .feed a{grid-template-columns:44px minmax(0,1fr)}
  .feed .tg{grid-column:2}
  .feed .h{grid-column:2}
  .timeline{grid-auto-flow:row;grid-auto-columns:auto}
  .ev{border-right:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none}}
</style>
</head>
<body data-view="feed">
<div class="pv">Design preview A · Pit Wall <a href="paddock.html">See preview B</a> <a href="../">Current site</a></div>
<div class="shell">
  <aside class="rail">
    <a class="logo" href="../" aria-label="Apex Media home"></a>
    <div class="ed" role="group" aria-label="Edition">
      <button type="button" data-ed="int" aria-pressed="true">International</button>
      <button type="button" data-ed="sl" aria-pressed="false">Sri Lanka</button>
    </div>
    <div><div class="cap" style="margin-bottom:8px">Series</div><div class="series" id="series" role="group" aria-label="Filter by series"></div></div>
    <div class="rail-foot"><span id="upd">Loading live data…</span><span>News links go to the original publishers.</span></div>
  </aside>
  <div style="min-width:0">
    <div class="top">
      <div class="ticker" aria-label="Latest results"><div class="ticker-track" id="ticker"></div></div>
      <div class="next" id="next"></div>
    </div>
    <main>
      <div class="board">
        <section class="panel feed-p vw vw-feed">
          <div class="ph"><h2><i></i>Newsfeed</h2><span class="cap" id="feedCount"></span></div>
          <div id="feat"></div>
          <ul class="feed" id="feed"></ul>
        </section>
        <section class="panel vw vw-results">
          <div class="ph"><h2><i></i>Results</h2><div class="tabs" role="tablist" id="resTabs"></div></div>
          <div id="results"></div>
        </section>
        <section class="panel vw vw-standings">
          <div class="ph"><h2><i></i>Standings</h2><span id="stSample"></span></div>
          <div style="padding:12px 14px 0"><label class="cap" for="champSel">Championship</label><select class="sel" id="champSel" style="margin-top:6px"></select></div>
          <div id="standings"></div>
        </section>
      </div>
      <section class="panel vw vw-calendar">
        <div class="ph"><h2><i></i>Calendar</h2><span class="cap">Local time</span></div>
        <div class="timeline" id="timeline"></div>
      </section>
    </main>
  </div>
</div>
<nav class="views" aria-label="Views">
  <button type="button" data-v="feed" aria-pressed="true">Feed</button>
  <button type="button" data-v="results" aria-pressed="false">Results</button>
  <button type="button" data-v="standings" aria-pressed="false">Standings</button>
  <button type="button" data-v="calendar" aria-pressed="false">Calendar</button>
</nav>
<script src="shared.js"></script>
<script>
(async function(){
const A=window.Apex, $=s=>document.querySelector(s);
let INT=null, D=null, ed='int', filter='All', resKey=null, champId=null, cdTimer=null;

function link(url){return url?`href="${url}" target="_blank" rel="noopener"`:'href="#"';}
function stamp(iso){const h=(Date.now()-Date.parse(iso))/36e5;return h<24?A.time(iso):A.day(iso);}

function render(){
  D=ed==='sl'?A.SL:INT;
  document.querySelectorAll('.ed button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ed===ed)));
  $('#upd').textContent=ed==='sl'?'Sri Lanka: published 2026 reports':(INT.updated?`Live data · updated ${A.ago(INT.updated)}`:'Live data unavailable');

  // series rail
  const counts={};D.items.forEach(i=>counts[i.series]=(counts[i.series]||0)+1);
  const ser=Object.keys(counts).sort((a,b)=>A.ORDER.indexOf(a)-A.ORDER.indexOf(b));
  if(filter!=='All'&&!counts[filter])filter='All';
  $('#series').innerHTML=[['All',D.items.length],...ser.map(s=>[s,counts[s]])].map(([s,n])=>`<button type="button" data-s="${A.esc(s)}" aria-pressed="${s===filter}" style="--c:${s==='All'?'var(--fg)':A.color(s)}"><i></i><span>${A.esc(s)}</span><span>${n}</span></button>`).join('');

  // ticker: result headlines
  const res=D.items.filter(i=>i.result).slice(0,12);
  const tk=(res.length?res:D.items.slice(0,8)).map(i=>`<a ${link(i.url)}><b>${A.esc(i.series)}</b>${i.title}</a>`).join('');
  $('#ticker').innerHTML=tk+tk;

  // next event
  const nx=D.calendar.find(e=>!e.done);
  clearInterval(cdTimer);
  if(nx){const tickCd=()=>{let s=Math.max(0,Math.floor((Date.parse(nx.main)-Date.now())/1000));const d=Math.floor(s/86400);s%=86400;
    $('#next').innerHTML=`<span class="cap">Next</span><b>${A.esc(nx.label)} · ${nx.name}</b><span class="mono">${nx.live?'LIVE':`${d}d ${String(Math.floor(s/3600)).padStart(2,'0')}h ${String(Math.floor(s%3600/60)).padStart(2,'0')}m`}</span>`;};
    tickCd();cdTimer=setInterval(tickCd,30000);} else $('#next').innerHTML='';

  renderFeed();renderResults();renderStandings();renderCalendar();
}

function renderFeed(){
  const list=D.items.filter(i=>filter==='All'||i.series===filter);
  $('#feedCount').textContent=`${list.length} stories${filter==='All'?'':' · '+filter}`;
  const f=list.find(i=>i.image)||list[0];
  $('#feat').innerHTML=f?`<a class="feat" ${link(f.url)}><div class="img" style="background-image:${f.image?`url('${f.image}')`:`linear-gradient(135deg,${A.color(f.series)},#121513)`}"></div><div><span class="tag" style="--c:${A.color(f.series)}">${A.esc(f.series)}</span><h3>${f.title}</h3><p>${f.summary||''}</p></div></a>`:'';
  $('#feed').innerHTML=list.filter(i=>i!==f).map(i=>`<li><a ${link(i.url)}><span class="t">${stamp(i.date)}</span><span class="tg"><span class="tag" style="--c:${A.color(i.series)}">${A.esc(i.series)}</span></span><span class="h">${i.result?'<span class="res-flag">RESULT</span>':''}${i.title}<small>${i.source}</small></span></a></li>`).join('')||'<li class="empty">No stories for this series yet.</li>';
}

function renderResults(){
  const R=D.results; if(!R.length){$('#results').innerHTML='<p class="empty">No results yet.</p>';$('#resTabs').innerHTML='';return;}
  if(!R.some(r=>r.key===resKey))resKey=R[0].key;
  $('#resTabs').innerHTML=R.length>1?R.map(r=>`<button role="tab" data-k="${r.key}" aria-selected="${r.key===resKey}">${r.key}</button>`).join(''):'';
  const r=R.find(x=>x.key===resKey);
  $('#results').innerHTML=`<div class="race-h"><span class="cap">${r.label} · ${A.esc(String(r.date))}</span><b>${r.race}</b><span class="cap" style="text-transform:none;letter-spacing:0">${r.place}</span></div>
    <ol class="tower">${r.rows.map(x=>`<li><span class="p">${x.pos}</span><span class="c" style="--c:${x.color||A.color(r.key==='SWS'?'SWS Endurance':r.key)}"></span><span class="n"><b>${x.name}${x.fastest?'<span class="fl">FASTEST</span>':''}</b><small>${x.team}</small></span><span class="v">${x.time}</span></li>`).join('')}</ol>
    ${r.note?`<p class="note">${r.note}</p>`:''}`;
}

function renderStandings(){
  const C=D.champs; if(!C.length){$('#standings').innerHTML='<p class="empty">No standings yet.</p>';return;}
  if(!C.some(c=>c.id===champId))champId=C[0].id;
  const groups=[...new Set(C.map(c=>c.group))];
  $('#champSel').innerHTML=groups.map(g=>`<optgroup label="${g}">${C.filter(c=>c.group===g).map(c=>`<option value="${c.id}" ${c.id===champId?'selected':''}>${c.title}</option>`).join('')}</optgroup>`).join('');
  const c=C.find(x=>x.id===champId), top=c.rows[0], col=A.color(c.series);
  $('#stSample').innerHTML=c.sample?'<span class="sample">Sample data</span>':'';
  $('#standings').innerHTML=`<div class="lead-bar" style="--c:${top.color||col}"><div><span class="cap">Leader · ${c.season}</span><br><b>${top.name}</b></div><div><span class="mono">${top.points}</span><small>+${+(top.points-c.rows[1].points).toFixed(1)}</small></div></div>
    <ol class="tower">${c.rows.map(x=>`<li><span class="p">${x.pos}</span><span class="c" style="--c:${x.color||col}"></span><span class="n"><b>${x.name}</b>${x.team?`<small>${x.team}</small>`:''}</span><span class="v pts">${x.points}<br><span class="v">${x.pos===1?'':'−'+(+(top.points-x.points).toFixed(1))}</span></span></li>`).join('')}</ol>
    <p class="note">Source: ${c.source}${c.link?` · <a href="${c.link}" target="_blank" rel="noopener">Full standings</a>`:''}</p>`;
}

function renderCalendar(){
  const C=D.calendar; const firstOpen=C.findIndex(e=>!e.done);
  const list=C.slice(Math.max(0,(firstOpen<0?C.length:firstOpen)-2),(firstOpen<0?C.length:firstOpen)+12);
  $('#timeline').innerHTML=list.map(e=>`<div class="ev ${e.done?'done':''} ${e.live?'live':''}" style="--c:${A.color(e.series)}"><span class="d">${A.day(e.main,{weekday:'short',day:'numeric',month:'short'})}</span><span class="tag" style="--c:${A.color(e.series)}">${A.esc(e.label)}</span><b>${e.name}</b><small>${e.place}</small></div>`).join('');
  const el=$('#timeline .ev:not(.done)'); if(el) $('#timeline').scrollLeft=el.offsetLeft-$('#timeline').offsetLeft;
}

// events
$('.ed').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ed=b.dataset.ed;filter='All';render();});
$('#series').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.s;document.querySelectorAll('#series button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderFeed();if(matchMedia('(max-width:900px)').matches)setView('feed');});
$('#resTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;resKey=b.dataset.k;renderResults();});
$('#champSel').addEventListener('change',e=>{champId=e.target.value;renderStandings();});
function setView(v){document.body.dataset.view=v;document.querySelectorAll('.views button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));scrollTo(0,0);}
$('.views').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v);});

INT=await A.loadInternational();
if(!INT.ok){ed='sl';}
render();
})();
</script>
</body>
</html>
